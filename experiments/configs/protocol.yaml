# Hardware experiments of the paper (Sec. 7), in the order of the paper. experiments/protocol.py plans and simulates
# every entry with run_box.py (same code as on the robot), prints the pre-flight verdict and the commands of every run.
# Run folders: experiments/runs/box/<experiment>_<task>_<grasp>_r<k>, k = 1..repetitions.
# Poses: x,y,yaw_deg,face of run_box.py (the marked corner of the box defines its frame; the replay shows it).

level: low            # run_box.py --level (low: box on the table, speed <= 0.5)
speed: 0.3            # speed factor of every run (an experiment may set its own); it scales the joint velocity bound too
# lag compensation of the joint controller (run_box.py --lead), for every experiment that does not set its own.
# Set true only after the air run has shown that the measured lag matches the model (docs/HARDWARE_DAY.md).
lead: false

experiments:
  prim:               # 7.2 primitive motions, free rotation
    repetitions: 5
    tasks:
      slide: {start: "0.50,0.00,0,lying", goal: "0.60,0.10,20,lying"}
      pivot: {start: "0.50,0.00,90,lying", goal: "0.50,-0.20,90,standing_flip"}

  gait:               # 7.3 object gaiting with one manipulator (run_box.py --gait)
    repetitions: 5
    gait: true
    # with lag compensation: without it the lag simulation ends 13 mm (lying) / 6 mm (standing) off the goal after
    # 25 screw motions, a hard NO-GO for a gait. These commands are valid only after the air run has confirmed the
    # lag model (docs/HARDWARE_DAY.md, section 3); until then do not run the gait entries.
    lead: true
    tasks:
      lying: {start: "0.50,0.10,0,lying", goal: "0.55,-0.08,30,lying"}
      standing: {start: "0.55,0.10,0,standing", goal: "0.55,-0.05,0,standing"}

  seq:                # 7.4 sequencing of sliding and pivoting motions, marked (not symmetric) box
    repetitions: 5
    tasks:
      turn: {start: "0.50,0.00,0,lying", goal: "0.55,0.10,30,standing"}         # onto the adjacent face
      flip: {start: "0.50,0.00,0,lying", goal: "0.50,0.00,0,lying_flip"}        # onto the opposite face
      flip_turn: {start: "0.55,0.10,90,standing", goal: "0.50,-0.10,0,lying_flip"}

  fr:                 # 7.5 free rotation against the rigid grasp: the same pivot, planned with free rotation
    repetitions: 3
    speed: 0.15       # slower: where the rigid grasp fails, its QP drives the joints to the bound before the stop;
                      # at 0.15 the hand coasts at most about 4 mm after it (pre-flight check, at most 5 mm)
    grasps: [free, rigid]   # rigid: the original fingers of the gripper (same geometry as the bearing fingertips)
    tasks:
      a: {start: "0.50,0.10,90,lying", goal: "0.50,-0.10,90,standing_flip"}
      b: {start: "0.60,0.15,90,lying", goal: "0.60,-0.05,90,standing_flip"}
      c: {start: "0.50,0.00,90,lying", goal: "0.50,0.20,90,standing"}
      d: {start: "0.50,-0.20,90,lying", goal: "0.50,0.00,90,standing"}
      e: {start: "0.45,0.00,0,lying", goal: "0.65,0.00,0,standing"}

  chain:              # 7.5 two pivots in one grasp (a roll by pi onto the opposite face, 0.40 m along y; run_box.py
                      # --chain, planning/chain.py): grasp near the bottom back corner, hand tilted, lift 0.25 m.
                      # Free rotation completes both pivots; the rigid grasp stops in the second (infeasible QP)
    repetitions: 3
    chain: true
    speed: 0.15       # as fr: the rigid grasp stops, and the hand must coast little after it
    grasps: [free, rigid]
    tasks:
      a: {start: "0.50,-0.20,90,lying", goal: "0.50,0.20,90,lying_flip"}     # rigid: stops at 92 of 180 deg (joint 7)
      b: {start: "0.45,-0.15,90,lying", goal: "0.45,0.25,90,lying_flip"}     # rigid: stops at 171 of 180 deg (joint 2)
