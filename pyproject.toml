[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name             = "pandaSim"
version          = "0.1.0"
description      = "A SOLID-compliant, backend-agnostic framework for robotic simulation"
readme           = "README.md"
requires-python  = ">=3.10,<3.11"


classifiers      = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies     = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
sim  = [
    "roboticstoolbox-python>=1.4",
    "spatialmath-python",
    "spatialgeometry",
    "swift-sim>=2.0",
    "qpsolvers[quadprog]",
    "pytransform3d",
    "modern_robotics",
    "trimesh",
    "coal",          # collision checking of the arm (planning/collision.py)
    "pyyaml",
]
genesis = [
    "torch",
    "genesis-world",
]
# Real robot: panda-python must match the robot's libfranka version (0.8.0 for the
# lab FER). The PyPI wheel bundles libfranka 0.9.2, so the 0.8.0 build of 1.1.1 from
# https://github.com/JeanElsner/panda-py/releases is kept in vendor/ (see [tool.uv.sources]).
robot = [
    "panda-python==1.1.1+libfranka.0.8.0",
    "python-dotenv",
]
dev  = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ipykernel",
    "black>=23.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/VahidDanesh/pandaSim"

# ——— authors must *only* have name+email ———
[[project.authors]]
name  = "Vahid Danesh"
email = "vahid.danesh@stonybrook.edu"

[[project.authors]]
name  = "Maede Boroji"
email = "maede.boroji@stonybrook.edu"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.uv.sources]
panda-python = { path = "vendor/panda_python-1.1.1+libfranka.0.8.0-cp310-cp310-manylinux_2_28_x86_64.whl" }
